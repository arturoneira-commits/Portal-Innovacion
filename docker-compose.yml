services:

  postgres:
    image: postgres:16
    container_name: portalvcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portalvcm
      POSTGRES_USER: portalvcm
      POSTGRES_PASSWORD: portalvcm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: portalvcm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: portalvcm
      MINIO_ROOT_PASSWORD: portalvcm_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: portalvcm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: portalvcm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  adminer:
    image: adminer:latest
    container_name: portalvcm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
  redis_data: